name: Release Multiplatform (Web + macOS + Windows + Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.0.0)'
        required: false

permissions:
  contents: write

jobs:
  verify-and-build-web:
    name: Verify Core Tests & Build Web Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run Vitest & TypeScript checks
        working-directory: web
        run: npm run test && npm run typecheck

      - name: Build static Web bundle
        working-directory: web
        run: npm run build

      - name: Archive Web static bundle
        working-directory: web/apps/studio
        run: zip -r MacTuner-Web-dist.zip dist

      - name: Upload Web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacTuner-Web-dist
          path: web/apps/studio/MacTuner-Web-dist.zip

  build-desktop:
    name: Build Tauri v2 (${{ matrix.platform }})
    needs: verify-and-build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux webkit2gtk dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Build & publish signed Tauri v2 release + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web/apps/studio
          tagName: ${{ github.ref_name }}
          releaseName: 'MacTuner ${{ github.ref_name }}'
          releaseBody: |
            ## MacTuner ${{ github.ref_name }} — Multiplatform Release
            - **macOS Universal** (`arm64` + `x86_64`) `.dmg`
            - **Windows x64** `.exe` / `.msi`
            - **Linux x64** `.AppImage` / `.deb`
            - **Auto-Updater:** Signed `latest.json` published automatically for in-app updates.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
